name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload assets for
        required: true
        type: string
      source_ref:
        description: Git ref to build from when manually dispatching
        required: false
        default: master
        type: string
      build_macos:
        description: Build macOS artifacts
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux artifacts
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build Windows artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    if: github.event_name == 'release' || inputs.build_macos == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: x64
          - runner: macos-14
            label: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.release_tag || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Ghostty dependency
        run: |
          git clone --depth 1 https://github.com/ghostty-org/ghostty.git deps/ghostty
          git -C deps/ghostty fetch --depth 1 origin 913c12097bad2feb8977853cf1a60c137a968b50
          git -C deps/ghostty checkout 913c12097bad2feb8977853cf1a60c137a968b50

      - name: Build native host
        run: bun run native:build:host

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required macOS release secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build macOS release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run release:stable

      - name: Upload macOS artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          metadata=(dist/latest-mac*.yml)
          files=(dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac*.yml)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No macOS DMG artifacts found" >&2
            exit 1
          fi
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Missing macOS ZIP artifacts required for auto-updates" >&2
            exit 1
          fi
          if [ ${#metadata[@]} -eq 0 ]; then
            echo "Missing macOS updater metadata (latest-mac*.yml)" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  build-linux:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_linux == true)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.release_tag || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Ghostty dependency
        run: |
          git clone --depth 1 https://github.com/ghostty-org/ghostty.git deps/ghostty
          git -C deps/ghostty fetch --depth 1 origin 913c12097bad2feb8977853cf1a60c137a968b50
          git -C deps/ghostty checkout 913c12097bad2feb8977853cf1a60c137a968b50

      - name: Build native host
        run: bun run native:build:host

      - name: Build Linux release
        run: bun run release:stable

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          appimages=(dist/*.AppImage)
          metadata=(dist/latest-linux*.yml)
          files=(dist/*.AppImage dist/*.AppImage.blockmap dist/latest-linux*.yml)
          if [ ${#appimages[@]} -eq 0 ]; then
            echo "No Linux artifacts found" >&2
            exit 1
          fi
          if [ ${#metadata[@]} -eq 0 ]; then
            echo "Missing Linux updater metadata (latest-linux*.yml)" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  build-windows:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_windows == true)
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref || inputs.release_tag || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Fetch Ghostty dependency
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ghostty-org/ghostty.git deps/ghostty
          git -C deps/ghostty fetch --depth 1 origin 913c12097bad2feb8977853cf1a60c137a968b50
          git -C deps/ghostty checkout 913c12097bad2feb8977853cf1a60c137a968b50

      - name: Build native host
        shell: bash
        run: bun run native:build:host

      - name: Build Windows release
        shell: bash
        run: bun run release:stable

      - name: Upload Windows artifacts to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          installers=(dist/*.exe)
          metadata=(dist/latest.yml)
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No Windows installer artifacts found" >&2
            exit 1
          fi
          if [ ${#metadata[@]} -eq 0 ]; then
            echo "Missing Windows updater metadata (latest.yml)" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
